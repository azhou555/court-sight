shot_classifier:
  architecture: "tcn"                  # "tcn" | "transformer"
  hidden_dim: 128
  num_blocks: 4
  label_smoothing: 0.1
  optimizer: "adamw"
  learning_rate: 1.0e-3
  weight_decay: 1.0e-2
  batch_size: 64
  max_epochs: 100
  early_stopping_patience: 10

execution_prob:
  backend: "xgboost"                   # "xgboost" | "lightgbm" | "mlp"
  n_estimators: 500
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  calibration: "isotonic"

win_prob:
  hidden_dim: 128
  num_heads: 4
  num_layers: 4
  ff_dim: 256
  dropout: 0.1
  max_seq_len: 20
  optimizer: "adamw"
  learning_rate: 1.0e-4
  weight_decay: 1.0e-2
  batch_size: 64
  max_epochs: 150
  pretrain_on_mcp: true
  mcp_pretrain_epochs: 50
  gradient_clip_max_norm: 1.0
  calibration: "isotonic"
